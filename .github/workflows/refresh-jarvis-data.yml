name: Refresh JARVIS data

# Reruns the Scout whenever the vault mirror changes, so jarvis.html never
# shows figures older than index.html itself.
#
# No loop: this job only ever commits data/jarvis-data.json, and the push
# trigger below ignores that path, so its own commit cannot start another run.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'agents/scout-vault.mjs'
  schedule:
    # 11:20 UTC daily (07:20 Eastern) — a safety net in case a mirror push
    # was missed. Produces no commit when nothing changed.
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jarvis-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Scout prints an audit line per field, so the run log shows exactly
      # what it read and anything it had to mark UNAVAILABLE.
      - name: Run the Scout against the mirror
        run: node agents/scout-vault.mjs

      - name: Commit the refreshed data, if it changed
        run: |
          if git diff --quiet -- data/jarvis-data.json; then
            echo "Mirror figures unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jarvis-data.json
          git commit -m "Refresh JARVIS data from the vault mirror"
          git push
