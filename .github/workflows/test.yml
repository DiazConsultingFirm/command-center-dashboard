name: Test

# The rule is test everything, so it runs on every push and every PR rather
# than when someone remembers. A red run means the dashboard is telling you
# something untrue, or is about to.

on:
  push:
    branches: [main]
    paths-ignore:
      # The vault mirror and the data it produces change hourly and are not
      # code. Testing them on every auto-update would be noise, and the Scout's
      # own audit output already covers that path.
      - 'index.html'
      - 'data/jarvis-data.json'
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both packages must be INSTALLED, not just invoked. `npx playwright
      # install` downloads browsers using a throwaway copy and leaves nothing
      # in node_modules, so the suite's `import('playwright')` had nothing to
      # resolve — which is exactly how the first CI run failed.
      - name: Install test dependencies
        run: npm install --no-save playwright@1.56.1 http-server@14

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the full suite
        run: node test/smoke.mjs
